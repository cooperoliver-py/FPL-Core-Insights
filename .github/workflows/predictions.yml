name: FPL Predictions

on:
  schedule:
    - cron: '30 0,8,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpl-predictions
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync upstream data
        run: |
          echo "DATA DOWNLOAD: fetching the latest upstream data"
          git remote add upstream https://github.com/olbauday/FPL-Core-Insights.git
          git fetch --no-tags upstream main
          data_sha=$(git rev-parse upstream/main)
          echo "FPL_DATA_SHA=$data_sha" >> "$GITHUB_ENV"
          git rm -r --ignore-unmatch data
          git restore --source=upstream/main --staged --worktree -- data
          echo "DATA DOWNLOAD COMPLETE: upstream commit $data_sha"
          du -sh data

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate predictions
        run: |
          echo "MODEL RUN: starting"
          python scripts/fpl_predictions.py
          echo "MODEL RUN COMPLETE"
          test -s predictions/latest.md
          test -s predictions/latest.csv
          echo "LATEST REPORT UPDATED"
          grep -m1 '^Last generated:' predictions/latest.md
          ls -lh predictions/latest.md predictions/latest.csv

      - name: Generate completed Teams of the Week
        run: python scripts/team_of_the_week.py

      - name: Run tests
        run: |
          if find tests -type f -name 'test*.py' -print -quit 2>/dev/null | grep -q .; then
            python -m unittest discover -s tests
          fi

      - name: Commit results
        run: |
          git add -A -- data predictions TeamOfTheWeek
          if git diff --cached --quiet; then
            echo "PUBLISH: no generated changes to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update FPL predictions'
          git push origin main
          echo "PUBLISH COMPLETE: latest data and predictions pushed to main"
