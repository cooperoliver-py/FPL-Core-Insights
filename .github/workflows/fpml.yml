name: FPML checks
on:
  push:
    paths: ['frontend/**', 'scripts/fpml_*.py', 'scripts/fpl_predictions.py', 'tests/**', 'requirements*.txt', 'supabase/**', '.github/workflows/fpml.yml']
  pull_request:
    paths: ['frontend/**', 'scripts/fpml_*.py', 'scripts/fpl_predictions.py', 'tests/**', 'requirements*.txt', 'supabase/**', '.github/workflows/fpml.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-web.txt
      - run: python -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
